# C-ABI leg (plan WS-C C1; docs/CAPI-STABILITY.md "Surface enforcement").
#
# Guards the frozen C surface on both platforms:
#   1. `swift build` of ALL targets — pins the Linux modulemap fix
#      (docs/capi-gap-audit.md V1): the LatticeCAPI SwiftPM build used to be
#      broken on Linux and no CI leg ever compiled it.
#   2. CMake build of the SHARED LatticeCAPI library — the true export
#      surface Kotlin/Python bindings load.
#   3. `nm` of the shared library diffed against the checked-in
#      Sources/LatticeCAPI/lattice_capi.symbols (the freeze gate; the
#      source-level CAPISurfaceTests can't see linker-level drift).
#   4. LatticeCAPITests (GoogleTest, links the C surface exactly as a
#      binding would) against the CMake-built shared library.
#   5. lattice.h compiled as pure C11 (stability rule 6).
#
# Kept as its own workflow (not a job in linux.yml/macos.yml): those legs
# gate the core test suite; this one gates the ABI and needs CMake + nm
# plumbing the others don't.
name: C ABI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  capi-linux:
    runs-on: ubuntu-latest
    # 6.3-noble is the toolchain the V1 modulemap fix was verified against
    # (its stricter explicit-module handling is what surfaced the bug).
    container: swift:6.3-noble
    env:
      CORE_SOURCE_SHA: ${{ github.sha }}
      CORE_SOURCE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Install dependencies
        run: apt-get update && apt-get install -y git libsqlite3-dev cmake

      - name: Fetch exact source into owned localdev directory
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CORE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CORE_SOURCE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          CORE_JOB_ROOT="$HOME/localdev/lattice-core-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          test ! -e "$CORE_JOB_ROOT"
          mkdir -p "$CORE_JOB_ROOT"/{tmp,swift-build,swift-cache,swift-config,swift-security,module-cache,symbols,test-logs}
          export TMPDIR="$CORE_JOB_ROOT/tmp" TMP="$CORE_JOB_ROOT/tmp" TEMP="$CORE_JOB_ROOT/tmp"
          {
            echo "CORE_JOB_ROOT=$CORE_JOB_ROOT"
            echo "TMPDIR=$TMPDIR"
            echo "TMP=$TMP"
            echo "TEMP=$TEMP"
            echo "CLANG_MODULE_CACHE_PATH=$CORE_JOB_ROOT/module-cache"
            echo "SWIFT_MODULECACHE_PATH=$CORE_JOB_ROOT/module-cache"
            echo "SWIFTPM_MODULECACHE_OVERRIDE=$CORE_JOB_ROOT/module-cache"
            echo "LATTICE_TEST_LOG_PATH=$CORE_JOB_ROOT/test-logs/native.log"
          } >> "$GITHUB_ENV"
          git init "$CORE_JOB_ROOT/source"
          git -C "$CORE_JOB_ROOT/source" fetch --depth=1 "https://github.com/${CORE_SOURCE_REPOSITORY}.git" "$CORE_SOURCE_SHA"
          git -C "$CORE_JOB_ROOT/source" checkout --detach "$CORE_SOURCE_SHA"
          test "$(git -C "$CORE_JOB_ROOT/source" rev-parse HEAD)" = "$CORE_SOURCE_SHA"

      - name: swift build (ALL targets — audit V1 pin)
        working-directory: ${{ env.CORE_JOB_ROOT }}/source
        run: |
          swift build --package-path "$CORE_JOB_ROOT/source" \
            --scratch-path "$CORE_JOB_ROOT/swift-build" --cache-path "$CORE_JOB_ROOT/swift-cache" \
            --config-path "$CORE_JOB_ROOT/swift-config" --security-path "$CORE_JOB_ROOT/swift-security"

      - name: swift run LatticeCAPITests (SwiftPM leg)
        working-directory: ${{ env.CORE_JOB_ROOT }}/source
        run: |
          swift run --package-path "$CORE_JOB_ROOT/source" \
            --scratch-path "$CORE_JOB_ROOT/swift-build" --cache-path "$CORE_JOB_ROOT/swift-cache" \
            --config-path "$CORE_JOB_ROOT/swift-config" --security-path "$CORE_JOB_ROOT/swift-security" \
            LatticeCAPITests

      - name: CMake build (shared LatticeCAPI + C-ABI tests)
        working-directory: ${{ env.CORE_JOB_ROOT }}/source
        # clang explicitly: match the Swift toolchain (the container's default
        # cc is gcc, which rejects sqlite-vec's NEON kernels on aarch64).
        run: |
          cmake -S "$CORE_JOB_ROOT/source" -B "$CORE_JOB_ROOT/cmake-build" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build "$CORE_JOB_ROOT/cmake-build" --target LatticeCAPI LatticeCAPITests -j "$(nproc)"

      - name: Symbols freeze gate (nm vs lattice_capi.symbols)
        working-directory: ${{ env.CORE_JOB_ROOT }}/source
        run: |
          nm -gD --defined-only "$CORE_JOB_ROOT/cmake-build/libLatticeCAPI.so" \
            | awk '$2=="T" && $3 ~ /^lattice_/ {print $3}' \
            | LC_ALL=C sort -u > "$CORE_JOB_ROOT/symbols/exported.symbols"
          grep -v '^#' Sources/LatticeCAPI/lattice_capi.symbols \
            | grep -v '^[[:space:]]*$' | LC_ALL=C sort -u > "$CORE_JOB_ROOT/symbols/declared.symbols"
          diff -u "$CORE_JOB_ROOT/symbols/declared.symbols" "$CORE_JOB_ROOT/symbols/exported.symbols"

      - name: Run LatticeCAPITests (against the shared library)
        working-directory: ${{ env.CORE_JOB_ROOT }}/source
        run: '"$CORE_JOB_ROOT/cmake-build/LatticeCAPITests"'

      - name: lattice.h compiles as pure C11
        working-directory: ${{ env.CORE_JOB_ROOT }}/source
        run: |
          clang -std=c11 -fsyntax-only -I Sources/LatticeCAPI/include \
            -I Tests/LatticeCAPIHeaderCheck/include \
            Tests/LatticeCAPIHeaderCheck/capi_header_compiles.c

  capi-macos:
    runs-on: macos-26
    env:
      CORE_SOURCE_SHA: ${{ github.sha }}
      CORE_SOURCE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Fetch exact source into owned localdev directory
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CORE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CORE_SOURCE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          CORE_JOB_ROOT="$HOME/localdev/lattice-core-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          test ! -e "$CORE_JOB_ROOT"
          mkdir -p "$CORE_JOB_ROOT"/{tmp,swift-build,swift-cache,swift-config,swift-security,module-cache,symbols,test-logs}
          export TMPDIR="$CORE_JOB_ROOT/tmp" TMP="$CORE_JOB_ROOT/tmp" TEMP="$CORE_JOB_ROOT/tmp"
          {
            echo "CORE_JOB_ROOT=$CORE_JOB_ROOT"
            echo "TMPDIR=$TMPDIR"
            echo "TMP=$TMP"
            echo "TEMP=$TEMP"
            echo "CLANG_MODULE_CACHE_PATH=$CORE_JOB_ROOT/module-cache"
            echo "SWIFT_MODULECACHE_PATH=$CORE_JOB_ROOT/module-cache"
            echo "SWIFTPM_MODULECACHE_OVERRIDE=$CORE_JOB_ROOT/module-cache"
            echo "LATTICE_TEST_LOG_PATH=$CORE_JOB_ROOT/test-logs/native.log"
          } >> "$GITHUB_ENV"
          git init "$CORE_JOB_ROOT/source"
          git -C "$CORE_JOB_ROOT/source" fetch --depth=1 "https://github.com/${CORE_SOURCE_REPOSITORY}.git" "$CORE_SOURCE_SHA"
          git -C "$CORE_JOB_ROOT/source" checkout --detach "$CORE_SOURCE_SHA"
          test "$(git -C "$CORE_JOB_ROOT/source" rev-parse HEAD)" = "$CORE_SOURCE_SHA"

      - name: swift run LatticeCAPITests (SwiftPM leg)
        working-directory: ${{ env.CORE_JOB_ROOT }}/source
        run: |
          swift run --package-path "$CORE_JOB_ROOT/source" \
            --scratch-path "$CORE_JOB_ROOT/swift-build" --cache-path "$CORE_JOB_ROOT/swift-cache" \
            --config-path "$CORE_JOB_ROOT/swift-config" --security-path "$CORE_JOB_ROOT/swift-security" \
            LatticeCAPITests

      - name: CMake build (shared LatticeCAPI + C-ABI tests)
        working-directory: ${{ env.CORE_JOB_ROOT }}/source
        run: |
          cmake -S "$CORE_JOB_ROOT/source" -B "$CORE_JOB_ROOT/cmake-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$CORE_JOB_ROOT/cmake-build" --target LatticeCAPI LatticeCAPITests -j "$(sysctl -n hw.ncpu)"

      - name: Symbols freeze gate (nm vs lattice_capi.symbols)
        working-directory: ${{ env.CORE_JOB_ROOT }}/source
        run: |
          nm -gU "$CORE_JOB_ROOT/cmake-build/libLatticeCAPI.dylib" \
            | awk '$2=="T" && $3 ~ /^_lattice_/ {sub(/^_/,"",$3); print $3}' \
            | LC_ALL=C sort -u > "$CORE_JOB_ROOT/symbols/exported.symbols"
          grep -v '^#' Sources/LatticeCAPI/lattice_capi.symbols \
            | grep -v '^[[:space:]]*$' | LC_ALL=C sort -u > "$CORE_JOB_ROOT/symbols/declared.symbols"
          diff -u "$CORE_JOB_ROOT/symbols/declared.symbols" "$CORE_JOB_ROOT/symbols/exported.symbols"

      - name: Run LatticeCAPITests (against the shared library)
        working-directory: ${{ env.CORE_JOB_ROOT }}/source
        run: '"$CORE_JOB_ROOT/cmake-build/LatticeCAPITests"'

      - name: lattice.h compiles as pure C11
        working-directory: ${{ env.CORE_JOB_ROOT }}/source
        run: |
          clang -std=c11 -fsyntax-only -I Sources/LatticeCAPI/include \
            -I Tests/LatticeCAPIHeaderCheck/include \
            Tests/LatticeCAPIHeaderCheck/capi_header_compiles.c
