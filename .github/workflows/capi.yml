# C-ABI leg (plan WS-C C1; docs/CAPI-STABILITY.md "Surface enforcement").
#
# Guards the frozen C surface on both platforms:
#   1. `swift build` of ALL targets — pins the Linux modulemap fix
#      (docs/capi-gap-audit.md V1): the LatticeCAPI SwiftPM build used to be
#      broken on Linux and no CI leg ever compiled it.
#   2. CMake build of the SHARED LatticeCAPI library — the true export
#      surface Kotlin/Python bindings load.
#   3. `nm` of the shared library diffed against the checked-in
#      Sources/LatticeCAPI/lattice_capi.symbols (the freeze gate; the
#      source-level CAPISurfaceTests can't see linker-level drift).
#   4. LatticeCAPITests (GoogleTest, links the C surface exactly as a
#      binding would) against the CMake-built shared library.
#   5. lattice.h compiled as pure C11 (stability rule 6).
#
# Kept as its own workflow (not a job in linux.yml/macos.yml): those legs
# gate the core test suite; this one gates the ABI and needs CMake + nm
# plumbing the others don't.
name: C ABI

on:
  workflow_call:
    inputs:
      release_profile:
        type: string
        required: false
        default: 'main'
      source_sha:
        type: string
        required: false
        default: ''
      source_tree:
        type: string
        required: false
        default: ''
      control_sha:
        type: string
        required: false
        default: ''
      candidate_sha256:
        type: string
        required: false
        default: ''
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  capi-linux:
    runs-on: ubuntu-latest
    # 6.3-noble is the toolchain the V1 modulemap fix was verified against
    # (its stricter explicit-module handling is what surfaced the bug).
    container: swift:6.3-noble
    env:
      CORE_SOURCE_SHA: ${{ inputs.release_profile == 'maintenance-1.4' && inputs.source_sha || github.sha }}
      CORE_SOURCE_REPOSITORY: ${{ github.repository }}
      CORE_RELEASE_PROFILE: ${{ inputs.release_profile || 'main' }}
      CORE_SOURCE_TREE: ${{ inputs.source_tree }}
      CORE_CONTROL_SHA: ${{ inputs.control_sha || github.sha }}
      MAINTENANCE_CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
    steps:
      - name: Install dependencies
        run: apt-get update && apt-get install -y git libsqlite3-dev cmake

      - name: Install maintenance receipt tooling
        if: ${{ inputs.release_profile == 'maintenance-1.4' }}
        run: apt-get install -y python3

      - name: Fetch exact source into owned localdev directory
        shell: bash
        run: |
          set -euo pipefail
          case "$CORE_RELEASE_PROFILE" in main|maintenance-1.4) ;; *) exit 1 ;; esac
          [[ "$CORE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CORE_SOURCE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          CORE_JOB_ROOT="$HOME/localdev/lattice-core-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          test ! -e "$CORE_JOB_ROOT"
          mkdir -p "$CORE_JOB_ROOT"/{tmp,swift-build,swift-cache,swift-config,swift-security,module-cache,symbols,test-logs}
          export TMPDIR="$CORE_JOB_ROOT/tmp" TMP="$CORE_JOB_ROOT/tmp" TEMP="$CORE_JOB_ROOT/tmp"
          {
            echo "CORE_JOB_ROOT=$CORE_JOB_ROOT"
            echo "TMPDIR=$TMPDIR"
            echo "TMP=$TMP"
            echo "TEMP=$TEMP"
            echo "CLANG_MODULE_CACHE_PATH=$CORE_JOB_ROOT/module-cache"
            echo "SWIFT_MODULECACHE_PATH=$CORE_JOB_ROOT/module-cache"
            echo "SWIFTPM_MODULECACHE_OVERRIDE=$CORE_JOB_ROOT/module-cache"
            echo "LATTICE_TEST_LOG_PATH=$CORE_JOB_ROOT/test-logs/native.log"
          } >> "$GITHUB_ENV"
          git init "$CORE_JOB_ROOT/source"
          git -C "$CORE_JOB_ROOT/source" fetch --depth=1 "https://github.com/${CORE_SOURCE_REPOSITORY}.git" "$CORE_SOURCE_SHA"
          git -C "$CORE_JOB_ROOT/source" checkout --detach "$CORE_SOURCE_SHA"
          test "$(git -C "$CORE_JOB_ROOT/source" rev-parse HEAD)" = "$CORE_SOURCE_SHA"

      - name: Prepare isolated maintenance control and evidence
        if: ${{ inputs.release_profile == 'maintenance-1.4' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CORE_SOURCE_TREE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CORE_CONTROL_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MAINTENANCE_CANDIDATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$CORE_CONTROL_SHA" = "$GITHUB_SHA"
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REPOSITORY" = jsflax/LatticeCore
          test "$(git -C "$CORE_JOB_ROOT/source" rev-parse HEAD^{tree})" = "$CORE_SOURCE_TREE"
          git -C "$CORE_JOB_ROOT/source" remote add origin "https://github.com/$CORE_SOURCE_REPOSITORY.git"
          git init "$CORE_JOB_ROOT/control"
          git -C "$CORE_JOB_ROOT/control" remote add origin "https://github.com/$CORE_SOURCE_REPOSITORY.git"
          git -C "$CORE_JOB_ROOT/control" fetch --depth=1 origin "$CORE_CONTROL_SHA"
          git -C "$CORE_JOB_ROOT/control" checkout --detach "$CORE_CONTROL_SHA"
          test "$(git -C "$CORE_JOB_ROOT/control" rev-parse HEAD)" = "$CORE_CONTROL_SHA"
          mkdir -p "$CORE_JOB_ROOT/maintenance"/{test-logs,commands,scripts,symbols}
          cat > "$CORE_JOB_ROOT/tmp/maintenance-command.sh" <<'BASH'
          maintenance_command() {
            local stage="$1"; shift
            { printf 'Command:'; printf ' %q' "$@"; printf '\n'; "$@"; } 2>&1 \
              | tee "$CORE_JOB_ROOT/maintenance/test-logs/$stage.log"
            python3 - "$CORE_JOB_ROOT/maintenance" "$stage" "$@" <<'PY'
          import json, pathlib, sys
          root, stage = pathlib.Path(sys.argv[1]), sys.argv[2]
          result = {'argv': sys.argv[3:], 'exitCode': 0, 'timedOut': False,
                    'signal': None, 'log': f'test-logs/{stage}.log'}
          (root / 'commands' / f'{stage}.json').write_text(json.dumps(result, sort_keys=True) + '\n')
          PY
          }
          BASH

      - name: Download exact maintenance candidate from this run attempt
        if: ${{ inputs.release_profile == 'maintenance-1.4' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: maintenance-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CORE_JOB_ROOT }}/maintenance/candidate

      - name: Verify maintenance candidate transport and source before native execution
        if: ${{ inputs.release_profile == 'maintenance-1.4' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$CORE_JOB_ROOT/maintenance/candidate" <<'PY'
          import hashlib, os, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          if not (sorted(p.name for p in root.iterdir()) == ['candidate.json']): raise SystemExit('maintenance workflow identity check failed')
          path = root / 'candidate.json'
          if not (path.is_file() and not path.is_symlink()): raise SystemExit('maintenance workflow identity check failed')
          if not (hashlib.sha256(path.read_bytes()).hexdigest() == os.environ['MAINTENANCE_CANDIDATE_SHA256']): raise SystemExit('maintenance workflow identity check failed')
          PY
          python3 "$CORE_JOB_ROOT/control/release-train/maintenance_release.py" verify-source \
            --candidate "$CORE_JOB_ROOT/maintenance/candidate/candidate.json" \
            --control-root "$CORE_JOB_ROOT/control" --product-root "$CORE_JOB_ROOT/source" \
            --output "$CORE_JOB_ROOT/maintenance/source-verification.json"
          { swift --version; clang --version; uname -a; } > "$CORE_JOB_ROOT/maintenance/toolchain.txt"

      - name: swift build (ALL targets — audit V1 pin)
        working-directory: ${{ env.CORE_JOB_ROOT }}/source
        run: |
          if [ "$CORE_RELEASE_PROFILE" = maintenance-1.4 ]; then
            bash -euo pipefail <<'MAINTENANCE'
            source "$CORE_JOB_ROOT/tmp/maintenance-command.sh"
            cat > "$CORE_JOB_ROOT/maintenance/scripts/all-target.sh" <<'STAGE'
          set -euo pipefail
          swift build --package-path "$CORE_JOB_ROOT/source" \
            --scratch-path "$CORE_JOB_ROOT/swift-build" --cache-path "$CORE_JOB_ROOT/swift-cache" \
            --config-path "$CORE_JOB_ROOT/swift-config" --security-path "$CORE_JOB_ROOT/swift-security"
          STAGE
            maintenance_command all-target bash "$CORE_JOB_ROOT/maintenance/scripts/all-target.sh"
          MAINTENANCE
          else
            swift build --package-path "$CORE_JOB_ROOT/source" \
              --scratch-path "$CORE_JOB_ROOT/swift-build" --cache-path "$CORE_JOB_ROOT/swift-cache" \
              --config-path "$CORE_JOB_ROOT/swift-config" --security-path "$CORE_JOB_ROOT/swift-security"
          fi

      - name: swift run LatticeCAPITests (SwiftPM leg)
        working-directory: ${{ env.CORE_JOB_ROOT }}/source
        run: |
          if [ "$CORE_RELEASE_PROFILE" = maintenance-1.4 ]; then
            bash -euo pipefail <<'MAINTENANCE'
            source "$CORE_JOB_ROOT/tmp/maintenance-command.sh"
            cat > "$CORE_JOB_ROOT/maintenance/scripts/swiftpm.sh" <<'STAGE'
          set -euo pipefail
          swift run --package-path "$CORE_JOB_ROOT/source" \
            --scratch-path "$CORE_JOB_ROOT/swift-build" --cache-path "$CORE_JOB_ROOT/swift-cache" \
            --config-path "$CORE_JOB_ROOT/swift-config" --security-path "$CORE_JOB_ROOT/swift-security" \
            LatticeCAPITests --gtest_list_tests > "$CORE_JOB_ROOT/maintenance/test-logs/capi-swiftpm.discovery.txt"
          export GTEST_OUTPUT="xml:$CORE_JOB_ROOT/maintenance/test-logs/capi-swiftpm.xml"
          swift run --package-path "$CORE_JOB_ROOT/source" \
            --scratch-path "$CORE_JOB_ROOT/swift-build" --cache-path "$CORE_JOB_ROOT/swift-cache" \
            --config-path "$CORE_JOB_ROOT/swift-config" --security-path "$CORE_JOB_ROOT/swift-security" \
            LatticeCAPITests
          STAGE
            maintenance_command swiftpm bash "$CORE_JOB_ROOT/maintenance/scripts/swiftpm.sh"
          MAINTENANCE
          else
            swift run --package-path "$CORE_JOB_ROOT/source" \
              --scratch-path "$CORE_JOB_ROOT/swift-build" --cache-path "$CORE_JOB_ROOT/swift-cache" \
              --config-path "$CORE_JOB_ROOT/swift-config" --security-path "$CORE_JOB_ROOT/swift-security" \
              LatticeCAPITests
          fi

      - name: CMake build (shared LatticeCAPI + C-ABI tests)
        working-directory: ${{ env.CORE_JOB_ROOT }}/source
        # clang explicitly: match the Swift toolchain (the container's default
        # cc is gcc, which rejects sqlite-vec's NEON kernels on aarch64).
        run: |
          if [ "$CORE_RELEASE_PROFILE" = maintenance-1.4 ]; then
            bash -euo pipefail <<'MAINTENANCE'
            source "$CORE_JOB_ROOT/tmp/maintenance-command.sh"
            cat > "$CORE_JOB_ROOT/maintenance/scripts/cmake-build.sh" <<'STAGE'
          set -euo pipefail
          cmake -S "$CORE_JOB_ROOT/source" -B "$CORE_JOB_ROOT/cmake-build" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build "$CORE_JOB_ROOT/cmake-build" --target LatticeCAPI LatticeCAPITests -j "$(nproc)"
          STAGE
            maintenance_command cmake-build bash "$CORE_JOB_ROOT/maintenance/scripts/cmake-build.sh"
          MAINTENANCE
          else
            cmake -S "$CORE_JOB_ROOT/source" -B "$CORE_JOB_ROOT/cmake-build" -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
            cmake --build "$CORE_JOB_ROOT/cmake-build" --target LatticeCAPI LatticeCAPITests -j "$(nproc)"
          fi

      - name: Symbols freeze gate (nm vs lattice_capi.symbols)
        working-directory: ${{ env.CORE_JOB_ROOT }}/source
        run: |
          if [ "$CORE_RELEASE_PROFILE" = maintenance-1.4 ]; then
            bash -euo pipefail <<'MAINTENANCE'
            source "$CORE_JOB_ROOT/tmp/maintenance-command.sh"
            cat > "$CORE_JOB_ROOT/maintenance/scripts/symbols.sh" <<'STAGE'
          set -euo pipefail
          nm -gD --defined-only "$CORE_JOB_ROOT/cmake-build/libLatticeCAPI.so" \
            | awk '$2=="T" && $3 ~ /^lattice_/ {print $3}' \
            | LC_ALL=C sort -u > "$CORE_JOB_ROOT/symbols/exported.symbols"
          grep -v '^#' Sources/LatticeCAPI/lattice_capi.symbols \
            | grep -v '^[[:space:]]*$' | LC_ALL=C sort -u > "$CORE_JOB_ROOT/symbols/declared.symbols"
          diff -u "$CORE_JOB_ROOT/symbols/declared.symbols" "$CORE_JOB_ROOT/symbols/exported.symbols"
          cp "$CORE_JOB_ROOT/symbols/declared.symbols" "$CORE_JOB_ROOT/symbols/exported.symbols" "$CORE_JOB_ROOT/maintenance/symbols/"
          STAGE
            maintenance_command symbols bash "$CORE_JOB_ROOT/maintenance/scripts/symbols.sh"
          MAINTENANCE
          else
            nm -gD --defined-only "$CORE_JOB_ROOT/cmake-build/libLatticeCAPI.so" \
              | awk '$2=="T" && $3 ~ /^lattice_/ {print $3}' \
              | LC_ALL=C sort -u > "$CORE_JOB_ROOT/symbols/exported.symbols"
            grep -v '^#' Sources/LatticeCAPI/lattice_capi.symbols \
              | grep -v '^[[:space:]]*$' | LC_ALL=C sort -u > "$CORE_JOB_ROOT/symbols/declared.symbols"
            diff -u "$CORE_JOB_ROOT/symbols/declared.symbols" "$CORE_JOB_ROOT/symbols/exported.symbols"
          fi

      - name: Run LatticeCAPITests (against the shared library)
        working-directory: ${{ env.CORE_JOB_ROOT }}/source
        run: |
          if [ "$CORE_RELEASE_PROFILE" = maintenance-1.4 ]; then
            bash -euo pipefail <<'MAINTENANCE'
            source "$CORE_JOB_ROOT/tmp/maintenance-command.sh"
            cat > "$CORE_JOB_ROOT/maintenance/scripts/cmake.sh" <<'STAGE'
          set -euo pipefail
          "$CORE_JOB_ROOT/cmake-build/LatticeCAPITests" --gtest_list_tests > "$CORE_JOB_ROOT/maintenance/test-logs/capi-cmake.discovery.txt"
          export GTEST_OUTPUT="xml:$CORE_JOB_ROOT/maintenance/test-logs/capi-cmake.xml"
          "$CORE_JOB_ROOT/cmake-build/LatticeCAPITests"
          STAGE
            maintenance_command cmake bash "$CORE_JOB_ROOT/maintenance/scripts/cmake.sh"
          MAINTENANCE
          else
            "$CORE_JOB_ROOT/cmake-build/LatticeCAPITests"
          fi

      - name: lattice.h compiles as pure C11
        working-directory: ${{ env.CORE_JOB_ROOT }}/source
        run: |
          if [ "$CORE_RELEASE_PROFILE" = maintenance-1.4 ]; then
            bash -euo pipefail <<'MAINTENANCE'
            source "$CORE_JOB_ROOT/tmp/maintenance-command.sh"
            cat > "$CORE_JOB_ROOT/maintenance/scripts/c11.sh" <<'STAGE'
          set -euo pipefail
          clang -std=c11 -fsyntax-only -I Sources/LatticeCAPI/include \
            -I Tests/LatticeCAPIHeaderCheck/include \
            Tests/LatticeCAPIHeaderCheck/capi_header_compiles.c
          STAGE
            maintenance_command c11 bash "$CORE_JOB_ROOT/maintenance/scripts/c11.sh"
          MAINTENANCE
          else
            clang -std=c11 -fsyntax-only -I Sources/LatticeCAPI/include \
              -I Tests/LatticeCAPIHeaderCheck/include \
              Tests/LatticeCAPIHeaderCheck/capi_header_compiles.c
          fi

      - name: Emit maintenance source-bound gate receipt
        if: ${{ inputs.release_profile == 'maintenance-1.4' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$CORE_JOB_ROOT/maintenance" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          stages = ['all-target', 'swiftpm', 'cmake-build', 'symbols', 'cmake', 'c11']
          manifest = {
              'schemaVersion': 1, 'gate': 'capi-linux',
              'suites': {'swiftpm': {'xml': 'test-logs/capi-swiftpm.xml', 'discovery': 'test-logs/capi-swiftpm.discovery.txt'}, 'cmake': {'xml': 'test-logs/capi-cmake.xml', 'discovery': 'test-logs/capi-cmake.discovery.txt'}},
              'commands': {s: json.loads((root / 'commands' / f'{s}.json').read_text()) for s in stages},
              'artifacts': {'toolchain': 'toolchain.txt', **{f'{s}-script': f'scripts/{s}.sh' for s in stages}},
          }
          manifest['artifacts'].update({'symbols-declared': 'symbols/declared.symbols', 'symbols-exported': 'symbols/exported.symbols'})
          (root / 'gate-manifest.json').write_text(json.dumps(manifest, sort_keys=True) + '\n')
          PY
          python3 "$CORE_JOB_ROOT/control/release-train/maintenance_release.py" gate-receipt \
            --candidate "$CORE_JOB_ROOT/maintenance/candidate/candidate.json" --gate capi-linux \
            --product-root "$CORE_JOB_ROOT/source" --artifact-root "$CORE_JOB_ROOT/maintenance" \
            --gate-manifest "$CORE_JOB_ROOT/maintenance/gate-manifest.json" \
            --output "$CORE_JOB_ROOT/maintenance/receipt.json"

      - name: Retain maintenance gate evidence
        if: ${{ inputs.release_profile == 'maintenance-1.4' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maintenance-capi-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CORE_JOB_ROOT }}/maintenance/receipt.json
            ${{ env.CORE_JOB_ROOT }}/maintenance/test-logs
            ${{ env.CORE_JOB_ROOT }}/maintenance/scripts
            ${{ env.CORE_JOB_ROOT }}/maintenance/symbols
            ${{ env.CORE_JOB_ROOT }}/maintenance/toolchain.txt
          if-no-files-found: error
          overwrite: false
          retention-days: 30
  capi-macos:
    runs-on: macos-26
    env:
      CORE_SOURCE_SHA: ${{ inputs.release_profile == 'maintenance-1.4' && inputs.source_sha || github.sha }}
      CORE_SOURCE_REPOSITORY: ${{ github.repository }}
      CORE_RELEASE_PROFILE: ${{ inputs.release_profile || 'main' }}
      CORE_SOURCE_TREE: ${{ inputs.source_tree }}
      CORE_CONTROL_SHA: ${{ inputs.control_sha || github.sha }}
      MAINTENANCE_CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
    steps:
      - name: Fetch exact source into owned localdev directory
        shell: bash
        run: |
          set -euo pipefail
          case "$CORE_RELEASE_PROFILE" in main|maintenance-1.4) ;; *) exit 1 ;; esac
          [[ "$CORE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CORE_SOURCE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          CORE_JOB_ROOT="$HOME/localdev/lattice-core-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          test ! -e "$CORE_JOB_ROOT"
          mkdir -p "$CORE_JOB_ROOT"/{tmp,swift-build,swift-cache,swift-config,swift-security,module-cache,symbols,test-logs}
          export TMPDIR="$CORE_JOB_ROOT/tmp" TMP="$CORE_JOB_ROOT/tmp" TEMP="$CORE_JOB_ROOT/tmp"
          {
            echo "CORE_JOB_ROOT=$CORE_JOB_ROOT"
            echo "TMPDIR=$TMPDIR"
            echo "TMP=$TMP"
            echo "TEMP=$TEMP"
            echo "CLANG_MODULE_CACHE_PATH=$CORE_JOB_ROOT/module-cache"
            echo "SWIFT_MODULECACHE_PATH=$CORE_JOB_ROOT/module-cache"
            echo "SWIFTPM_MODULECACHE_OVERRIDE=$CORE_JOB_ROOT/module-cache"
            echo "LATTICE_TEST_LOG_PATH=$CORE_JOB_ROOT/test-logs/native.log"
          } >> "$GITHUB_ENV"
          git init "$CORE_JOB_ROOT/source"
          git -C "$CORE_JOB_ROOT/source" fetch --depth=1 "https://github.com/${CORE_SOURCE_REPOSITORY}.git" "$CORE_SOURCE_SHA"
          git -C "$CORE_JOB_ROOT/source" checkout --detach "$CORE_SOURCE_SHA"
          test "$(git -C "$CORE_JOB_ROOT/source" rev-parse HEAD)" = "$CORE_SOURCE_SHA"

      - name: Prepare isolated maintenance control and evidence
        if: ${{ inputs.release_profile == 'maintenance-1.4' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CORE_SOURCE_TREE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CORE_CONTROL_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MAINTENANCE_CANDIDATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$CORE_CONTROL_SHA" = "$GITHUB_SHA"
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REPOSITORY" = jsflax/LatticeCore
          test "$(git -C "$CORE_JOB_ROOT/source" rev-parse HEAD^{tree})" = "$CORE_SOURCE_TREE"
          git -C "$CORE_JOB_ROOT/source" remote add origin "https://github.com/$CORE_SOURCE_REPOSITORY.git"
          git init "$CORE_JOB_ROOT/control"
          git -C "$CORE_JOB_ROOT/control" remote add origin "https://github.com/$CORE_SOURCE_REPOSITORY.git"
          git -C "$CORE_JOB_ROOT/control" fetch --depth=1 origin "$CORE_CONTROL_SHA"
          git -C "$CORE_JOB_ROOT/control" checkout --detach "$CORE_CONTROL_SHA"
          test "$(git -C "$CORE_JOB_ROOT/control" rev-parse HEAD)" = "$CORE_CONTROL_SHA"
          mkdir -p "$CORE_JOB_ROOT/maintenance"/{test-logs,commands,scripts,symbols}
          cat > "$CORE_JOB_ROOT/tmp/maintenance-command.sh" <<'BASH'
          maintenance_command() {
            local stage="$1"; shift
            { printf 'Command:'; printf ' %q' "$@"; printf '\n'; "$@"; } 2>&1 \
              | tee "$CORE_JOB_ROOT/maintenance/test-logs/$stage.log"
            python3 - "$CORE_JOB_ROOT/maintenance" "$stage" "$@" <<'PY'
          import json, pathlib, sys
          root, stage = pathlib.Path(sys.argv[1]), sys.argv[2]
          result = {'argv': sys.argv[3:], 'exitCode': 0, 'timedOut': False,
                    'signal': None, 'log': f'test-logs/{stage}.log'}
          (root / 'commands' / f'{stage}.json').write_text(json.dumps(result, sort_keys=True) + '\n')
          PY
          }
          BASH

      - name: Download exact maintenance candidate from this run attempt
        if: ${{ inputs.release_profile == 'maintenance-1.4' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: maintenance-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CORE_JOB_ROOT }}/maintenance/candidate

      - name: Verify maintenance candidate transport and source before native execution
        if: ${{ inputs.release_profile == 'maintenance-1.4' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$CORE_JOB_ROOT/maintenance/candidate" <<'PY'
          import hashlib, os, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          if not (sorted(p.name for p in root.iterdir()) == ['candidate.json']): raise SystemExit('maintenance workflow identity check failed')
          path = root / 'candidate.json'
          if not (path.is_file() and not path.is_symlink()): raise SystemExit('maintenance workflow identity check failed')
          if not (hashlib.sha256(path.read_bytes()).hexdigest() == os.environ['MAINTENANCE_CANDIDATE_SHA256']): raise SystemExit('maintenance workflow identity check failed')
          PY
          python3 "$CORE_JOB_ROOT/control/release-train/maintenance_release.py" verify-source \
            --candidate "$CORE_JOB_ROOT/maintenance/candidate/candidate.json" \
            --control-root "$CORE_JOB_ROOT/control" --product-root "$CORE_JOB_ROOT/source" \
            --output "$CORE_JOB_ROOT/maintenance/source-verification.json"
          { swift --version; clang --version; uname -a; } > "$CORE_JOB_ROOT/maintenance/toolchain.txt"

      - name: swift run LatticeCAPITests (SwiftPM leg)
        working-directory: ${{ env.CORE_JOB_ROOT }}/source
        run: |
          if [ "$CORE_RELEASE_PROFILE" = maintenance-1.4 ]; then
            bash -euo pipefail <<'MAINTENANCE'
            source "$CORE_JOB_ROOT/tmp/maintenance-command.sh"
            cat > "$CORE_JOB_ROOT/maintenance/scripts/swiftpm.sh" <<'STAGE'
          set -euo pipefail
          swift run --package-path "$CORE_JOB_ROOT/source" \
            --scratch-path "$CORE_JOB_ROOT/swift-build" --cache-path "$CORE_JOB_ROOT/swift-cache" \
            --config-path "$CORE_JOB_ROOT/swift-config" --security-path "$CORE_JOB_ROOT/swift-security" \
            LatticeCAPITests --gtest_list_tests > "$CORE_JOB_ROOT/maintenance/test-logs/capi-swiftpm.discovery.txt"
          export GTEST_OUTPUT="xml:$CORE_JOB_ROOT/maintenance/test-logs/capi-swiftpm.xml"
          swift run --package-path "$CORE_JOB_ROOT/source" \
            --scratch-path "$CORE_JOB_ROOT/swift-build" --cache-path "$CORE_JOB_ROOT/swift-cache" \
            --config-path "$CORE_JOB_ROOT/swift-config" --security-path "$CORE_JOB_ROOT/swift-security" \
            LatticeCAPITests
          STAGE
            maintenance_command swiftpm bash "$CORE_JOB_ROOT/maintenance/scripts/swiftpm.sh"
          MAINTENANCE
          else
            swift run --package-path "$CORE_JOB_ROOT/source" \
              --scratch-path "$CORE_JOB_ROOT/swift-build" --cache-path "$CORE_JOB_ROOT/swift-cache" \
              --config-path "$CORE_JOB_ROOT/swift-config" --security-path "$CORE_JOB_ROOT/swift-security" \
              LatticeCAPITests
          fi

      - name: CMake build (shared LatticeCAPI + C-ABI tests)
        working-directory: ${{ env.CORE_JOB_ROOT }}/source
        run: |
          if [ "$CORE_RELEASE_PROFILE" = maintenance-1.4 ]; then
            bash -euo pipefail <<'MAINTENANCE'
            source "$CORE_JOB_ROOT/tmp/maintenance-command.sh"
            cat > "$CORE_JOB_ROOT/maintenance/scripts/cmake-build.sh" <<'STAGE'
          set -euo pipefail
          cmake -S "$CORE_JOB_ROOT/source" -B "$CORE_JOB_ROOT/cmake-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$CORE_JOB_ROOT/cmake-build" --target LatticeCAPI LatticeCAPITests -j "$(sysctl -n hw.ncpu)"
          STAGE
            maintenance_command cmake-build bash "$CORE_JOB_ROOT/maintenance/scripts/cmake-build.sh"
          MAINTENANCE
          else
            cmake -S "$CORE_JOB_ROOT/source" -B "$CORE_JOB_ROOT/cmake-build" -DCMAKE_BUILD_TYPE=Release
            cmake --build "$CORE_JOB_ROOT/cmake-build" --target LatticeCAPI LatticeCAPITests -j "$(sysctl -n hw.ncpu)"
          fi

      - name: Symbols freeze gate (nm vs lattice_capi.symbols)
        working-directory: ${{ env.CORE_JOB_ROOT }}/source
        run: |
          if [ "$CORE_RELEASE_PROFILE" = maintenance-1.4 ]; then
            bash -euo pipefail <<'MAINTENANCE'
            source "$CORE_JOB_ROOT/tmp/maintenance-command.sh"
            cat > "$CORE_JOB_ROOT/maintenance/scripts/symbols.sh" <<'STAGE'
          set -euo pipefail
          nm -gU "$CORE_JOB_ROOT/cmake-build/libLatticeCAPI.dylib" \
            | awk '$2=="T" && $3 ~ /^_lattice_/ {sub(/^_/,"",$3); print $3}' \
            | LC_ALL=C sort -u > "$CORE_JOB_ROOT/symbols/exported.symbols"
          grep -v '^#' Sources/LatticeCAPI/lattice_capi.symbols \
            | grep -v '^[[:space:]]*$' | LC_ALL=C sort -u > "$CORE_JOB_ROOT/symbols/declared.symbols"
          diff -u "$CORE_JOB_ROOT/symbols/declared.symbols" "$CORE_JOB_ROOT/symbols/exported.symbols"
          cp "$CORE_JOB_ROOT/symbols/declared.symbols" "$CORE_JOB_ROOT/symbols/exported.symbols" "$CORE_JOB_ROOT/maintenance/symbols/"
          STAGE
            maintenance_command symbols bash "$CORE_JOB_ROOT/maintenance/scripts/symbols.sh"
          MAINTENANCE
          else
            nm -gU "$CORE_JOB_ROOT/cmake-build/libLatticeCAPI.dylib" \
              | awk '$2=="T" && $3 ~ /^_lattice_/ {sub(/^_/,"",$3); print $3}' \
              | LC_ALL=C sort -u > "$CORE_JOB_ROOT/symbols/exported.symbols"
            grep -v '^#' Sources/LatticeCAPI/lattice_capi.symbols \
              | grep -v '^[[:space:]]*$' | LC_ALL=C sort -u > "$CORE_JOB_ROOT/symbols/declared.symbols"
            diff -u "$CORE_JOB_ROOT/symbols/declared.symbols" "$CORE_JOB_ROOT/symbols/exported.symbols"
          fi

      - name: Run LatticeCAPITests (against the shared library)
        working-directory: ${{ env.CORE_JOB_ROOT }}/source
        run: |
          if [ "$CORE_RELEASE_PROFILE" = maintenance-1.4 ]; then
            bash -euo pipefail <<'MAINTENANCE'
            source "$CORE_JOB_ROOT/tmp/maintenance-command.sh"
            cat > "$CORE_JOB_ROOT/maintenance/scripts/cmake.sh" <<'STAGE'
          set -euo pipefail
          "$CORE_JOB_ROOT/cmake-build/LatticeCAPITests" --gtest_list_tests > "$CORE_JOB_ROOT/maintenance/test-logs/capi-cmake.discovery.txt"
          export GTEST_OUTPUT="xml:$CORE_JOB_ROOT/maintenance/test-logs/capi-cmake.xml"
          "$CORE_JOB_ROOT/cmake-build/LatticeCAPITests"
          STAGE
            maintenance_command cmake bash "$CORE_JOB_ROOT/maintenance/scripts/cmake.sh"
          MAINTENANCE
          else
            "$CORE_JOB_ROOT/cmake-build/LatticeCAPITests"
          fi

      - name: lattice.h compiles as pure C11
        working-directory: ${{ env.CORE_JOB_ROOT }}/source
        run: |
          if [ "$CORE_RELEASE_PROFILE" = maintenance-1.4 ]; then
            bash -euo pipefail <<'MAINTENANCE'
            source "$CORE_JOB_ROOT/tmp/maintenance-command.sh"
            cat > "$CORE_JOB_ROOT/maintenance/scripts/c11.sh" <<'STAGE'
          set -euo pipefail
          clang -std=c11 -fsyntax-only -I Sources/LatticeCAPI/include \
            -I Tests/LatticeCAPIHeaderCheck/include \
            Tests/LatticeCAPIHeaderCheck/capi_header_compiles.c
          STAGE
            maintenance_command c11 bash "$CORE_JOB_ROOT/maintenance/scripts/c11.sh"
          MAINTENANCE
          else
            clang -std=c11 -fsyntax-only -I Sources/LatticeCAPI/include \
              -I Tests/LatticeCAPIHeaderCheck/include \
              Tests/LatticeCAPIHeaderCheck/capi_header_compiles.c
          fi

      - name: Emit maintenance source-bound gate receipt
        if: ${{ inputs.release_profile == 'maintenance-1.4' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$CORE_JOB_ROOT/maintenance" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          stages = ['swiftpm', 'cmake-build', 'symbols', 'cmake', 'c11']
          manifest = {
              'schemaVersion': 1, 'gate': 'capi-macos',
              'suites': {'swiftpm': {'xml': 'test-logs/capi-swiftpm.xml', 'discovery': 'test-logs/capi-swiftpm.discovery.txt'}, 'cmake': {'xml': 'test-logs/capi-cmake.xml', 'discovery': 'test-logs/capi-cmake.discovery.txt'}},
              'commands': {s: json.loads((root / 'commands' / f'{s}.json').read_text()) for s in stages},
              'artifacts': {'toolchain': 'toolchain.txt', **{f'{s}-script': f'scripts/{s}.sh' for s in stages}},
          }
          manifest['artifacts'].update({'symbols-declared': 'symbols/declared.symbols', 'symbols-exported': 'symbols/exported.symbols'})
          (root / 'gate-manifest.json').write_text(json.dumps(manifest, sort_keys=True) + '\n')
          PY
          python3 "$CORE_JOB_ROOT/control/release-train/maintenance_release.py" gate-receipt \
            --candidate "$CORE_JOB_ROOT/maintenance/candidate/candidate.json" --gate capi-macos \
            --product-root "$CORE_JOB_ROOT/source" --artifact-root "$CORE_JOB_ROOT/maintenance" \
            --gate-manifest "$CORE_JOB_ROOT/maintenance/gate-manifest.json" \
            --output "$CORE_JOB_ROOT/maintenance/receipt.json"

      - name: Retain maintenance gate evidence
        if: ${{ inputs.release_profile == 'maintenance-1.4' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maintenance-capi-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CORE_JOB_ROOT }}/maintenance/receipt.json
            ${{ env.CORE_JOB_ROOT }}/maintenance/test-logs
            ${{ env.CORE_JOB_ROOT }}/maintenance/scripts
            ${{ env.CORE_JOB_ROOT }}/maintenance/symbols
            ${{ env.CORE_JOB_ROOT }}/maintenance/toolchain.txt
          if-no-files-found: error
          overwrite: false
          retention-days: 30
