name: Recovery installed fixture qualification

on:
  push:
    branches: [codex/recovery-installed-qualification-20261022]
  workflow_dispatch:
    inputs:
      source_bundle_sha256:
        description: 'SHA256 of committed exact source009 bundle (full reference 6433e0f5…; no alternate source)'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: recovery-installed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installed:
    name: Installed ${{ matrix.batch }}
    runs-on: macos-26
    timeout-minutes: 145
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        batch: [canonical-a, canonical-b, journal, nonempty]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      QUALIFICATION_BATCH: ${{ matrix.batch }}
      QUALIFICATION_SOURCE_BUNDLE_SHA256: ${{ github.event_name == 'push' && '3b1fab7bbd1a7710398118b8d5ca77bd84ec7ec5708a78113d6fa9b5eda76360' || inputs.source_bundle_sha256 }}
      QUALIFICATION_REPOSITORY: ${{ github.repository }}
      QUALIFICATION_COMMIT: ${{ github.sha }}
    steps:
      # Fetch directly into real ~/localdev. No default-workspace checkout,
      # account-home rewrite, cached Native output or installation-state copy.
      - name: Fetch exact committed controls and source DATA into real localdev
        timeout-minutes: 8
        env:
          QUALIFICATION_CONTENTS_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYBOOT'
          from pathlib import Path
          import hashlib, json, os, pwd, re, stat, urllib.error, urllib.parse, urllib.request
          home=Path(pwd.getpwuid(os.geteuid()).pw_dir)
          if not home.is_absolute() or home!=Path(os.path.normpath(home)) or any(c in str(home)for c in ('\n','\r','\0')):
              raise RuntimeError('actual normalized bounded account home required')
          def secure(path):
              current=Path('/')
              for component in path.parts[1:]:
                  current/=component;s=current.lstat()
                  if not stat.S_ISDIR(s.st_mode)or stat.S_ISLNK(s.st_mode)or s.st_uid not in (0,os.geteuid())or s.st_mode&0o022:
                      raise RuntimeError('actual project ancestor owner/mode differs')
          secure(home)
          batch=os.environ['QUALIFICATION_BATCH'];run=os.environ['GITHUB_RUN_ID'];attempt=os.environ['GITHUB_RUN_ATTEMPT']
          if batch not in ('canonical-a','canonical-b','journal','nonempty')or not run.isdecimal()or not attempt.isdecimal():
              raise RuntimeError('closed hosted job identity required')
          localdev=home/'localdev';localdev.mkdir(mode=0o700,exist_ok=True);secure(localdev)
          project=localdev/('lattice-installed-'+run+'-'+attempt+'-'+batch)
          project.mkdir(mode=0o700,exist_ok=False);secure(project);os.chdir(project)
          for name in ('control','evidence','tmp','clang-modules','cache'):(project/name).mkdir(mode=0o700)
          with open(os.environ['GITHUB_ENV'],'a')as output:
              for key,value in {'HOST_PROJECT_ROOT':str(project),'TMPDIR':str(project/'tmp'),'TMP':str(project/'tmp'),
                                'TEMP':str(project/'tmp'),'CLANG_MODULE_CACHE_PATH':str(project/'clang-modules'),
                                'XDG_CACHE_HOME':str(project/'cache')}.items():output.write(key+'='+value+'\n')
          repo=os.environ['QUALIFICATION_REPOSITORY'];commit=os.environ['QUALIFICATION_COMMIT'];bundle_sha=os.environ['QUALIFICATION_SOURCE_BUNDLE_SHA256']
          record={'state':'BOOTSTRAPPING_UNQUALIFIED','actualHome':str(home),'actualUid':os.geteuid(),'projectRoot':str(project),
                  'batch':batch,'repository':repo,'commit':commit,'runId':run,'runAttempt':attempt,'job':os.environ['GITHUB_JOB'],
                  'sourceBundleSHA256':bundle_sha,'files':[],'nativeIssued':False}
          def record_progress():
              (project/'evidence/BOOTSTRAP-PROGRESS.json').write_text(json.dumps(record,indent=2)+'\n')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,request,fp,code,message,headers,newurl):raise RuntimeError('unexpected contents redirect refused')
          opener=urllib.request.build_opener(NoRedirect)
          try:
              if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+',repo)or not re.fullmatch(r'[0-9a-f]{40}',commit)or not re.fullmatch(r'[0-9a-f]{64}',bundle_sha):
                  raise RuntimeError('exact committed source and bundle SHA required')
              inputs=[('.github/qualification/recovery_installed_qualification.py','control/recovery_installed_qualification.py','be421f77b75294e3108235a671a062d160c8237decf7a7444f54a62d0e163895',128*1024),
                      ('.github/qualification/stage_installed_fixture.py','control/stage_installed_fixture.py','ce223e15abc09a0b856e2d537d243a0e3cd0fae74022a3a12abfbeeebc48f478',128*1024),
                      ('.github/qualification/observer-limits.json','control/observer-limits.json','8736ec6c2f3653369170ac9d3a770497ec8d8ae21aabcc975d2b41c5f565958f',16*1024),
                      ('.github/qualification/recovery-installed-source009.tar.gz','source009.tar.gz',bundle_sha,64*1024*1024)]
              for source,destination,expected,cap in inputs:
                  url='https://api.github.com/repos/'+repo+'/contents/'+urllib.parse.quote(source,safe='/')+'?ref='+commit
                  request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['QUALIFICATION_CONTENTS_TOKEN'],
                      'Accept':'application/vnd.github.raw+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'lattice-installed-qualification'})
                  h=hashlib.sha256();size=0;path=project/destination
                  with opener.open(request,timeout=45)as response,path.open('xb')as output:
                      os.fchmod(output.fileno(),0o600)
                      while True:
                          block=response.read(1024*1024)
                          if not block:break
                          size+=len(block)
                          if size>cap:raise RuntimeError('bounded committed input exceeded')
                          output.write(block);h.update(block)
                  actual=h.hexdigest()
                  if actual!=expected:raise RuntimeError('exact committed input body differs: '+source)
                  record['files'].append({'source':source,'path':str(path),'bytes':size,'sha256':actual});record_progress()
              record['state']='EXACT_COMMITTED_DATA_FETCHED_NOT_BUILT_OR_INSTALLED'
              (project/'BOOTSTRAP.json').write_text(json.dumps(record,indent=2)+'\n')
              (project/'evidence/BOOTSTRAP.json').write_bytes((project/'BOOTSTRAP.json').read_bytes());record_progress()
          except BaseException as error:
              record['state']='BOOTSTRAP_REFUSAL_NO_NATIVE_ISSUED';record['error']=repr(error);record_progress();raise
          PYBOOT

      - name: Qualify exact installed source and real lifecycle
        timeout-minutes: 132
        working-directory: ${{ env.HOST_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          python3 "$HOST_PROJECT_ROOT/control/recovery_installed_qualification.py" \
            --project-root "$HOST_PROJECT_ROOT" --batch "$QUALIFICATION_BATCH"

      # Failed/unknown runs retain raw diagnostics. Only controller RESULT's
      # final gates can qualify them; upload success never implies Native pass.
      - name: Preserve original raw outcomes and XML
        if: always() && env.HOST_PROJECT_ROOT != ''
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: recovery-installed-${{ matrix.batch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.HOST_PROJECT_ROOT }}/evidence/**
            ${{ env.HOST_PROJECT_ROOT }}/fixture/artifacts/**
            ${{ env.HOST_PROJECT_ROOT }}/fixture/PLAN.json
            ${{ env.HOST_PROJECT_ROOT }}/fixture/LOCATORS.json
            ${{ env.HOST_PROJECT_ROOT }}/fixture/package/resource-package.v1
            ${{ env.HOST_PROJECT_ROOT }}/data-config/image-pins.json
            ${{ env.HOST_PROJECT_ROOT }}/control/observer-limits.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
