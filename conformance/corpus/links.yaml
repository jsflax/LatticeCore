{
  "format_version": 1,
  "suite": "links",
  "scenarios": [
    {
      "name": "link-set-and-traverse",
      "description": "Setting a to-one link persists it; a dotted read traverses to the target's field.",
      "schema": {
        "version": 1,
        "tables": {
          "CfPet": {
            "properties": {
              "name": {
                "type": "string"
              },
              "kind": {
                "type": "string"
              }
            }
          },
          "CfOwner": {
            "properties": {
              "name": {
                "type": "string"
              },
              "pet": {
                "type": "link",
                "target": "CfPet"
              },
              "pets": {
                "type": "list",
                "target": "CfPet"
              }
            }
          }
        }
      },
      "ops": [
        {
          "op": "insert",
          "table": "CfPet",
          "values": {
            "name": "rex",
            "kind": "dog"
          },
          "as": "rex"
        },
        {
          "op": "insert",
          "table": "CfOwner",
          "values": {
            "name": "alice"
          },
          "as": "alice"
        },
        {
          "op": "update",
          "ref": "alice",
          "values": {
            "pet": {
              "$ref": "rex"
            }
          }
        },
        {
          "op": "read",
          "ref": "alice",
          "fields": [
            "pet.name",
            "pet.kind"
          ],
          "save": "linked"
        }
      ],
      "expect": [
        {
          "var": "linked",
          "equals": [
            "rex",
            "dog"
          ]
        }
      ]
    },
