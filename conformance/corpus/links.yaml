    {
      "name": "list-append-preserves-order",
      "description": "List append preserves insertion order; size and ordered element reads agree.",
      "schema": {
        "version": 1,
        "tables": {
          "CfPet": {
            "properties": {
              "name": {
                "type": "string"
              },
              "kind": {
                "type": "string"
              }
            }
          },
          "CfOwner": {
            "properties": {
              "name": {
                "type": "string"
              },
              "pet": {
                "type": "link",
                "target": "CfPet"
              },
              "pets": {
                "type": "list",
                "target": "CfPet"
              }
            }
          }
        }
      },
      "ops": [
        {
          "op": "insert",
          "table": "CfPet",
          "values": {
            "name": "rex",
            "kind": "dog"
          },
          "as": "rex"
        },
        {
          "op": "insert",
          "table": "CfPet",
          "values": {
            "name": "whiskers",
            "kind": "cat"
          },
          "as": "whiskers"
        },
        {
          "op": "insert",
          "table": "CfPet",
          "values": {
            "name": "buddy",
            "kind": "dog"
          },
          "as": "buddy"
        },
        {
          "op": "insert",
          "table": "CfOwner",
          "values": {
            "name": "alice"
          },
          "as": "alice"
        },
        {
          "op": "list_append",
          "ref": "alice",
          "property": "pets",
          "item": {
            "$ref": "rex"
          }
        },
        {
          "op": "list_append",
          "ref": "alice",
          "property": "pets",
          "item": {
            "$ref": "whiskers"
          }
        },
        {
          "op": "list_append",
          "ref": "alice",
          "property": "pets",
          "item": {
            "$ref": "buddy"
          }
        },
        {
          "op": "list_size",
          "ref": "alice",
          "property": "pets",
          "save": "n"
        },
        {
          "op": "list_read",
          "ref": "alice",
          "property": "pets",
          "field": "name",
          "save": "members"
        }
      ],
      "expect": [
        {
          "var": "n",
          "equals": 3
        },
        {
          "var": "members",
          "equals": [
            "rex",
            "whiskers",
            "buddy"
          ]
        }
      ]
    },
