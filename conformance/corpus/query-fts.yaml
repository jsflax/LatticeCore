{
  "format_version": 1,
  "suite": "query-fts",
  "scenarios": [
    {
      "name": "single-term",
      "description": "A single FTS5 term matches every row containing it.",
      "schema": {
        "version": 1,
        "tables": {
          "CfArticle": {
            "properties": {
              "title": {
                "type": "string"
              },
              "content": {
                "type": "string",
                "full_text": true
              }
            }
          }
        }
      },
      "ops": [
        {
          "op": "insert",
          "table": "CfArticle",
          "values": {
            "title": "alpha",
            "content": "machine learning improves search quality"
          }
        },
        {
          "op": "insert",
          "table": "CfArticle",
          "values": {
            "title": "beta",
            "content": "cooking pasta with fresh tomato sauce"
          }
        },
        {
          "op": "insert",
          "table": "CfArticle",
          "values": {
            "title": "gamma",
            "content": "deep learning networks for machine translation"
          }
        },
        {
          "op": "insert",
          "table": "CfArticle",
          "values": {
            "title": "delta",
            "content": "database indexing and search performance"
          }
        },
        {
          "op": "fts",
          "table": "CfArticle",
          "column": "content",
          "match": "machine",
          "columns": [
            "title"
          ],
          "save": "hits"
        }
      ],
      "expect": [
        {
          "var": "hits",
          "equals": [
            [
              "alpha"
            ],
            [
              "gamma"
            ]
          ],
          "unordered": true
        }
      ]
    },
