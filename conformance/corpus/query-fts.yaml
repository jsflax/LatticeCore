    {
      "name": "match-update-visibility",
      "description": "The FTS index follows row updates: the old text stops matching, the new text matches.",
      "schema": {
        "version": 1,
        "tables": {
          "CfArticle": {
            "properties": {
              "title": {
                "type": "string"
              },
              "content": {
                "type": "string",
                "full_text": true
              }
            }
          }
        }
      },
      "ops": [
        {
          "op": "insert",
          "table": "CfArticle",
          "as": "a1",
          "values": {
            "title": "alpha",
            "content": "original text about databases"
          }
        },
        {
          "op": "fts",
          "table": "CfArticle",
          "column": "content",
          "match": "databases",
          "columns": [
            "title"
          ],
          "save": "before"
        },
        {
          "op": "update",
          "ref": "a1",
          "values": {
            "content": "revised text about compilers"
          }
        },
        {
          "op": "fts",
          "table": "CfArticle",
          "column": "content",
          "match": "databases",
          "columns": [
            "title"
          ],
          "save": "after_old"
        },
        {
          "op": "fts",
          "table": "CfArticle",
          "column": "content",
          "match": "compilers",
          "columns": [
            "title"
          ],
          "save": "after_new"
        }
      ],
      "expect": [
        {
          "var": "before",
          "equals": [
            [
              "alpha"
            ]
          ],
          "unordered": true
        },
        {
          "var": "after_old",
          "equals": [],
          "unordered": true
        },
        {
          "var": "after_new",
          "equals": [
            [
              "alpha"
            ]
          ],
          "unordered": true
        }
      ]
    }
  ]
