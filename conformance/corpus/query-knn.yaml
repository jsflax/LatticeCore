          "values": {
            "title": "d",
            "kind": "y",
            "embedding": [
              10,
              0,
              0,
              0
            ]
          }
        },
        {
          "op": "knn",
          "table": "CfDoc",
          "column": "embedding",
          "query": [
            0,
