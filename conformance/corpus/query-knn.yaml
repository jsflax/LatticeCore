            0,
            0
          ],
          "k": 4,
          "metric": "l2",
          "where": {
            "field": "kind",
            "op": "eq",
            "value": "x"
          },
          "columns": [
            "title"
          ],
          "save": "order"
        }
      ],
      "expect": [
