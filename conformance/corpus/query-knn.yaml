{
  "format_version": 1,
  "suite": "query-knn",
  "scenarios": [
    {
      "name": "l2-order-and-distances",
      "description": "L2 nearest returns ascending Euclidean distance; integer coordinates give exact perfect-square distances.",
      "schema": {
        "version": 1,
        "tables": {
          "CfDoc": {
            "properties": {
              "title": {
                "type": "string"
              },
              "kind": {
                "type": "string"
              },
              "embedding": {
                "type": "vector",
                "dims": 4
              }
            }
          }
        }
      },
      "ops": [
        {
          "op": "insert",
          "table": "CfDoc",
          "values": {
            "title": "a",
            "kind": "x",
            "embedding": [
              1,
              0,
              0,
              0
            ]
          }
        },
        {
          "op": "insert",
          "table": "CfDoc",
          "values": {
            "title": "b",
            "kind": "y",
            "embedding": [
              0,
              2,
              0,
              0
            ]
          }
        },
        {
          "op": "insert",
          "table": "CfDoc",
          "values": {
            "title": "c",
            "kind": "x",
            "embedding": [
              3,
              4,
              0,
              0
            ]
          }
        },
        {
          "op": "insert",
          "table": "CfDoc",
          "values": {
            "title": "d",
            "kind": "y",
            "embedding": [
              10,
              0,
              0,
              0
            ]
          }
        },
        {
          "op": "knn",
          "table": "CfDoc",
          "column": "embedding",
          "query": [
            0,
            0,
            0,
            0
          ],
          "k": 4,
          "metric": "l2",
          "columns": [
            "title"
          ],
          "save": "order",
          "save_distances": "dists"
        }
      ],
      "expect": [
        {
          "var": "order",
          "equals": [
            [
              "a"
            ],
            [
              "b"
            ],
            [
              "c"
            ],
            [
              "d"
            ]
          ]
        },
        {
          "var": "dists",
          "equals": [
            1.0,
            2.0,
            5.0,
            10.0
          ]
        }
      ]
    },
    {
      "name": "l2-top-k",
      "description": "k limits the result to the k nearest.",
      "schema": {
