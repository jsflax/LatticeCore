    {
      "name": "cosine-order",
      "description": "Cosine distance orders by angle; distance values are not asserted (not binary-exact in general).",
      "schema": {
        "version": 1,
        "tables": {
          "CfDoc": {
            "properties": {
              "title": {
                "type": "string"
              },
              "kind": {
                "type": "string"
              },
              "embedding": {
                "type": "vector",
                "dims": 4
              }
            }
          }
        }
      },
      "ops": [
        {
          "op": "insert",
          "table": "CfDoc",
          "values": {
            "title": "p",
            "kind": "x",
            "embedding": [
              2,
              0,
              0,
              0
            ]
          }
        },
        {
          "op": "insert",
          "table": "CfDoc",
          "values": {
            "title": "q",
            "kind": "x",
            "embedding": [
              1,
              1,
              0,
              0
            ]
          }
        },
        {
          "op": "insert",
          "table": "CfDoc",
          "values": {
            "title": "r",
            "kind": "x",
            "embedding": [
              0,
              3,
              0,
              0
            ]
          }
        },
        {
          "op": "insert",
          "table": "CfDoc",
          "values": {
            "title": "s",
            "kind": "x",
            "embedding": [
              -1,
              0,
              0,
              0
            ]
          }
        },
        {
          "op": "knn",
          "table": "CfDoc",
          "column": "embedding",
          "query": [
            1,
            0,
            0,
            0
          ],
          "k": 4,
          "metric": "cosine",
          "columns": [
            "title"
          ],
          "save": "order"
        }
      ],
      "expect": [
        {
          "var": "order",
          "equals": [
            [
              "p"
            ],
            [
              "q"
            ],
            [
              "r"
            ],
            [
              "s"
            ]
          ]
        }
      ]
    },
    {
      "name": "knn-with-where-prefilter",
      "description": "A where predicate restricts the candidate set before the nearest search.",
      "schema": {
