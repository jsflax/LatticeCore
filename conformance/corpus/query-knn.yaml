        "tables": {
          "CfDoc": {
            "properties": {
              "title": {
                "type": "string"
              },
              "kind": {
                "type": "string"
              },
              "embedding": {
                "type": "vector",
                "dims": 4
              }
            }
          }
        }
      },
      "ops": [
        {
          "op": "insert",
          "table": "CfDoc",
          "values": {
            "title": "a",
            "kind": "x",
            "embedding": [
              1,
              0,
              0,
              0
            ]
          }
        },
        {
          "op": "insert",
          "table": "CfDoc",
          "values": {
            "title": "b",
            "kind": "y",
            "embedding": [
              0,
              2,
              0,
              0
            ]
          }
        },
        {
          "op": "insert",
          "table": "CfDoc",
          "values": {
            "title": "c",
