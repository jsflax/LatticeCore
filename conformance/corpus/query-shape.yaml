{
  "format_version": 1,
  "suite": "query-shape",
  "scenarios": [
    {
      "name": "sort-asc",
      "description": "Ascending sort on an int column (distinct values).",
      "schema": {
        "version": 1,
        "tables": {
          "CfPerson": {
            "properties": {
              "name": {
                "type": "string"
              },
              "age": {
                "type": "int"
              },
              "score": {
                "type": "double"
              },
              "active": {
                "type": "bool"
              },
              "nickname": {
                "type": "string",
                "optional": true
              },
              "city": {
                "type": "string"
              }
            }
          }
        }
      },
      "ops": [
        {
          "op": "insert",
          "table": "CfPerson",
          "values": {
            "name": "alice",
            "age": 30,
            "score": 9.5,
            "active": true,
            "city": "lisbon"
          }
        },
        {
          "op": "insert",
          "table": "CfPerson",
          "values": {
            "name": "bob",
            "age": 25,
            "score": 7.25,
            "active": false,
            "city": "porto"
          }
        },
        {
          "op": "insert",
          "table": "CfPerson",
          "values": {
            "name": "carol",
            "age": 41,
            "score": 8.5,
            "active": true,
            "city": "lisbon"
          }
        },
        {
          "op": "insert",
          "table": "CfPerson",
          "values": {
            "name": "erin",
            "age": 35,
            "score": 9.75,
            "active": true,
            "city": "porto"
          }
        }
      ],
      "expect": [
        {
          "rows": {
            "table": "CfPerson",
            "columns": [
              "name"
            ],
            "sort": {
              "by": "age",
              "order": "asc"
            },
            "equals": [
              [
                "bob"
              ],
              [
                "alice"
              ],
              [
                "erin"
              ],
              [
                "carol"
              ]
            ]
          }
        }
      ]
    },
