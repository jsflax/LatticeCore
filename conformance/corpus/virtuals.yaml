{
  "format_version": 1,
  "suite": "virtuals",
  "scenarios": [
    {
      "name": "virtual-link-set-and-read",
      "description": "A polymorphic to-one link stores a concrete type and reads its shared field.",
      "capabilities": [
        "virtual"
      ],
      "schema": {
        "version": 1,
        "protocols": {
          "CfNoteworthy": {
            "shared": {
              "label": "string"
            }
          }
        },
        "tables": {
          "CfNoteA": {
            "conforms": [
              "CfNoteworthy"
            ],
            "properties": {
              "label": {
                "type": "string"
              },
              "extra_a": {
                "type": "int"
              }
            }
          },
          "CfNoteB": {
            "conforms": [
              "CfNoteworthy"
            ],
            "properties": {
              "label": {
                "type": "string"
              },
              "extra_b": {
                "type": "string"
              }
            }
          },
          "CfBinder": {
            "properties": {
              "title": {
                "type": "string"
              },
              "main": {
                "type": "virtual_link",
                "protocol": "CfNoteworthy"
              },
              "notes": {
                "type": "virtual_list",
                "protocol": "CfNoteworthy"
              }
            }
          }
        }
      },
      "ops": [
        {
          "op": "insert",
          "table": "CfNoteA",
          "as": "a1",
          "values": {
            "label": "alpha",
            "extra_a": 7
          }
        },
        {
          "op": "insert",
          "table": "CfBinder",
          "as": "binder",
          "values": {
            "title": "b1"
          }
        },
        {
          "op": "update",
          "ref": "binder",
          "values": {
            "main": {
              "$ref": "a1"
            }
          }
        },
        {
          "op": "read",
          "ref": "binder",
          "fields": [
            "main.label"
          ],
          "save": "linked"
        }
      ],
      "expect": [
        {
          "var": "linked",
          "equals": [
            "alpha"
          ]
        }
      ]
    },
